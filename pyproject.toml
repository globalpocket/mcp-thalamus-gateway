[project]
name = "mcp-thalamus-gateway"
version = "0.1.0"
description = "MCP gateway and Thalamus subagent runtime bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "thalamus @ git+https://github.com/globalpocket/thalamus.git",
  "nats-py>=2.9.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "docker>=7.1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["gateway*", "subagent*", "schemas*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=gateway --cov=subagent --cov=schemas --cov-report=term-missing"
testpaths = ["tests"]
